general {
    # Lock command: prevents multiple instances
    lock_cmd = pidof hyprlock || hyprlock
    
    # Lock before suspend/hibernate
    before_sleep_cmd = loginctl lock-session
    
    # Restore display after wake
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock screen after 10 minutes (600 seconds) of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off screen (DPMS) after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 30 minutes (1800 seconds)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}   
